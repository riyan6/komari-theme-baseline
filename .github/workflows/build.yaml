name: Build and Release Assets

on:
  release:
    types: [created] # 创建新的 Release 时触发
  workflow_dispatch:
    inputs:
      tag:
        description: "要构建并上传到的 Release tag（手动触发时必填）"
        required: true
        type: string

jobs:
  build_and_upload:
    runs-on: ubuntu-latest
    permissions:
      contents: write # 写入 Release 附件所需

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install

      - name: Build project
        run: npm run build

      - name: Verify required theme files exist
        run: |
          ls -la preview.webp
          ls -la komari-theme.json
          ls -la dist/

      # Komari 主题包必须是 preview.webp + komari-theme.json + dist/ 三者一起打包，
      # 只打包 dist/ 不是可上传的主题包。
      - name: Package theme (preview.webp + komari-theme.json + dist)
        run: |
          rm -rf release-package dist-release.zip
          mkdir -p release-package
          cp preview.webp release-package/
          cp komari-theme.json release-package/
          cp -r dist release-package/
          cd release-package
          zip -qr ../dist-release.zip .
          cd ..
          ls -la dist-release.zip

      - name: Upload Release Asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          gh release upload "$RELEASE_TAG" dist-release.zip \
            --repo "$GITHUB_REPOSITORY" --clobber
