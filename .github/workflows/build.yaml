name: Build and Release Assets

on:
  # 推一个 tag（如 v1.0.1）即自动构建并发布 Release
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "要构建并发布到的 tag（手动触发时必填，例如 v1.0.2）"
        required: true
        type: string

permissions:
  contents: write # 创建 Release / 上传附件所需

jobs:
  build_and_release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install

      - name: Build project
        run: npm run build

      - name: Verify required theme files exist
        run: |
          ls -la preview.webp
          ls -la komari-theme.json
          ls -la dist/

      # Komari 主题包必须是 preview.webp + komari-theme.json + dist/ 三者一起打包，
      # 只打包 dist/ 不是可上传的主题包。
      - name: Package theme (preview.webp + komari-theme.json + dist)
        run: |
          rm -rf release-package dist-release.zip
          mkdir -p release-package
          cp preview.webp release-package/
          cp komari-theme.json release-package/
          cp -r dist release-package/
          cd release-package
          zip -qr ../dist-release.zip .
          cd ..
          ls -la dist-release.zip

      - name: Create or update Release with theme package
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || inputs.tag }}
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" dist-release.zip \
              --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$RELEASE_TAG" dist-release.zip \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "$RELEASE_TAG" \
              --generate-notes \
              --latest
          fi
